name: Security & Linting CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax Check Zsh Configs
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/.zshrc.d/00-platform.zsh
          zsh -n zsh/.zshrc.d/aliases.zsh

      - name: Install Stylua
        run: brew install stylua || npm install -g stylua

      - name: Lint Lua Configs (Neovim)
        run: stylua --check nvim/.config/nvim

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  codex-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          brew install stow
          brew install --cask chatgpt
          /Applications/ChatGPT.app/Contents/Resources/codex --version
          echo '/Applications/ChatGPT.app/Contents/Resources' >> "$GITHUB_PATH"
          python -m pip install -r scripts/codex-requirements.txt
      - name: Validate generated policy and migration
        run: |
          node scripts/validate-agent-policy.mjs
          node --test scripts/test-codex-policy.mjs
          bash -n scripts/bootstrap-codex.sh scripts/bootstrap-skills.sh
          python scripts/test-codex-config.py
          python scripts/test-codex-sandbox.py
