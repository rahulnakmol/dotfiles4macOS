name: Security & Linting CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-id: 20

      - name: Syntax Check Zsh Configs
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/.zshrc.d/00-platform.zsh
          zsh -n zsh/.zshrc.d/aliases.zsh

      - name: Install Stylua
        run: brew install stylua || npm install -g stylua

      - name: Lint Lua Configs (Neovim)
        run: stylua --check nvim/.config/nvim

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
