name: Security & Linting CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  raycast-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate native Raycast scripts and generated references
        run: |
          for script in setup/Raycast.command scripts/setup-raycast-native.sh raycast/.config/raycast/workspaces/run.sh raycast/.config/raycast/scripts/*.sh; do
            bash -n "$script"
          done
          node scripts/build-raycast-native.mjs --check
          node scripts/build-raycast-launchers.mjs --check
          node --test scripts/test-raycast-native.mjs scripts/test-documentation.mjs

  workstation-profiles:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Stow
        run: brew install stow tmux
      - name: Validate shell syntax and generated files
        run: |
          bash -n install.sh setup/*.command scripts/setup-workstation.sh scripts/setup-private-ai-gateway.sh scripts/setup-codex-profiles.sh scripts/cleanup-codex-profiles.sh scripts/bootstrap-skills.sh
          node scripts/render-workstation-docs.mjs --check
      - name: Validate FDE and TF activation and rollback
        run: |
          node --test scripts/test-documentation.mjs scripts/test-install.mjs scripts/test-private-ai-gateway.mjs scripts/test-codex-profiles.mjs scripts/test-agent-command-routing.mjs scripts/test-workstation.mjs
      - name: Smoke-test tmux configuration
        run: |
          tmux -f tmux/.config/tmux/tmux.conf -L audit new-session -d
          tmux -L audit kill-server

  lint-and-validate:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax Check Zsh Configs
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/.zshrc.d/00-platform.zsh
          zsh -n zsh/.zshrc.d/aliases.zsh

      - name: Install Stylua
        run: brew install stylua || npm install -g stylua

      - name: Lint Lua Configs (Neovim)
        run: stylua --check nvim/.config/nvim

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trufflehog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  codex-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          brew install stow
          brew install --cask chatgpt
          /Applications/ChatGPT.app/Contents/Resources/codex --version
          # The Homebrew app can lag the runtime required by the permission profile.
          # Use a pinned CLI only for the real sandbox test on this CI runner.
          npm install --global @openai/codex@0.153.1
          codex --version
          python -m pip install -r scripts/codex-requirements.txt
      - name: Validate generated policy and migration
        run: |
          node scripts/validate-agent-policy.mjs
          node --test scripts/test-codex-policy.mjs
          bash -n scripts/bootstrap-codex.sh scripts/bootstrap-skills.sh scripts/setup-codex-profiles.sh scripts/cleanup-codex-profiles.sh
          python scripts/test-codex-config.py
          python scripts/test-codex-sandbox.py
