name: Feature Request
description: Suggest an idea or new configuration for these dotfiles
title: "feat: [Brief Description]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new configuration, module, or alias? Let us know!
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the configuration, module, or alias you would like to add. Include code snippets or references if available.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
