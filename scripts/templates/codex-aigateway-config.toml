# Machine-local gateway values replace the placeholders below during setup.
# Re-run scripts/setup-private-ai-gateway.sh to refresh provider/model settings.
model_provider = "private_gateway"
model = __PRIVATE_AI_GATEWAY_MODEL__
model_reasoning_effort = "medium"
model_reasoning_summary = "auto"
model_verbosity = "low"
service_tier = "default"
web_search = "live"
approval_policy = "on-request"
default_permissions = "dotfiles"

[desktop]
followUpQueueMode = "steer"
external-agent-import-sync-enabled = false
show-context-window-usage = true
composerEnterBehavior = "enter"
git-branch-prefix = "openai/"
git-pull-request-merge-method = "squash"

[model_providers.private_gateway]
name = "Private AI gateway"
base_url = __PRIVATE_AI_GATEWAY_BASE_URL__
wire_api = "responses"
supports_websockets = false

[model_providers.private_gateway.auth]
command = "/bin/cat"
args = [__PRIVATE_AI_GATEWAY_KEY_FILE__]
cwd = "/"
timeout_ms = 5000
refresh_interval_ms = 300000

# BEGIN GENERATED DOTFILES POLICY
# Generated from agent-policy/catalog.json; other settings above are editable.

[permissions.dotfiles]
extends = ":workspace"
description = "Workspace editing with shared secret-path restrictions on macOS."

