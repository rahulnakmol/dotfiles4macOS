# Essential Tmux Configuration
set -g default-terminal "tmux-256color"                                                                                 # Set terminal to 256 colors
set-option -sa terminal-overrides ",xterm*:Tc"                                                                          # Set terminal to 256 colors
set-option -g allow-passthrough on                                                                                      # Allow passthrough
set -g mouse on

# Keybindings
unbind C-b                                                                                                              # Unbind default prefix
set -g prefix C-a                                                                                                       # Set new prefix to Ctrl + a
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration Reloaded"                                         # Reload tmux configuration on Ctrl + a r
bind -n M-Left select-pane -L                                                                                           # Bind Meta + Left to select pane to the left
bind -n M-Right select-pane -R                                                                                          # Bind Meta + Right to select pane to the right
bind -n M-Up select-pane -U                                                                                             # Bind Meta + Up to select pane to the top
bind -n M-Down select-pane -D                                                                                           # Bind Meta + Down to select pane to the bottom
bind -n M-H previous-window                                                                                             # Bind Meta + H to go to previous window
bind -n M-L next-window                                                                                                 # Bind Meta + L to go to next window
bind "'" split-window -v -c "#{pane_current_path}"                                                                      # Bind ' to split window vertically(-)
bind \\ split-window -h -c "#{pane_current_path}"                                                                       # Bind \ to split window horizontally(|)

set -g base-index 1                                                                                                     # Set base index to 1
set -g pane-base-index 1                                                                                                # Set pane base index to 1
set-window-option -g pane-base-index 1                                                                                  # Set pane base index to 1
set-option -g renumber-windows on                                                                                       # Renumber windows from 1

# Theming to Catppuccin
set -g status-bg default                                                                                                # Set status bar background color
set -g status-style bg=default                                                                                          # Set status bar background color
set -g @catppuccin_flavor "macchiato"                                                                                   # Set Catppuccino flavor to Macchiato
set -g @catppuccin_window_status_style "rounded"                                                                        # Set window status style to rounded
set -g @catppuccin_window_left_separator ""                                                                            # Set window left separator
set -g @catppuccin_window_right_separator " "                                                                          # Set window right separator
set -g @catppuccin_window_middle_separator " █"                                                                         # Set window middle separator
set -g @catppuccin_window_number_position "right"                                                                       # Set window number position to right
set -g @catppuccin_window_default_fill "number"                                                                         # Set window default fill to number
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set-option -g status-position bottom
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_pomodor_plus}"

# Tmux plugins
set -g @plugin 'tmux-plugins/tpm'                                                                                       # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible'                                                                             # Sensible Tmux defaults
set -g @plugin 'christoomey/vim-tmux-navigator'                                                                         # Vim keybindings for Tmux
set -g @plugin 'catppuccin/tmux'                                                                                        # Catppuccino theme
set -g @plugin 'tmux-plugins/tmux-yank'                                                                                 # Better copy to clipboard

# Automatic Tmux Plugin Manager Installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm \
   && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'                                                                                           # Load Tmux Plugin Manager
