# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  tmux.conf — Catppuccin Macchiato · Prefix: C-a                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ── Quick Reference ───────────────────────────────────────────────────────────
#
#   Navigation (no prefix needed)
#     M-←/→/↑/↓     move between panes        (also C-h/j/k/l via vim-navigator)
#     M-H / M-L     previous / next window
#
#   Splits & Panes (C-a +)
#     '              split ─ horizontal         \   split │ vertical
#     x              smart kill (confirm if not shell)
#     r              reload config
#
#   AI Tools  (uppercase to avoid clobbering tmux defaults: c = new-window,
#              o = next pane)
#   ┌──────────────┬───────────────────────────┬───────────────────────────────┐
#   │  Key         │  C-a C (Claude)           │  C-a O (OpenCode)            │
#   ├──────────────┼───────────────────────────┼───────────────────────────────┤
#   │  c/o / Enter │  popup session            │  popup session               │
#   │  /           │  one-shot prompt          │  one-shot run                │
#   │  s           │  split (sonnet)           │  split (default)             │
#   │  w           │  new window               │  new window                  │
#   ├──────────────┼───────────────────────────┼───────────────────────────────┤
#   │  Model keys  │  o = opus  a = autopilot  │  p = pro (opus)              │
#   │              │  p = plan (read-only)     │  c = codex (gpt)             │
#   │                                          │  u = ui (gemini)             │
#   │                                          │  q = quick (minimax)         │
#   └──────────────┴───────────────────────────┴───────────────────────────────┘
#
# ── Core ──────────────────────────────────────────────────────────────────────

set  -g  default-terminal    "tmux-256color"
set  -sa terminal-overrides  ",xterm*:Tc"
set  -g  allow-passthrough   on
set  -g  mouse               on
set  -g  base-index          1
set  -g  pane-base-index     1
set  -g  renumber-windows    on

# ── Prefix ────────────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-a

# ── Navigation (prefix-free) ─────────────────────────────────────────────────
# Panes: Meta + arrows  (vim-tmux-navigator adds C-h/j/k/l)
# Windows: Meta + H/L   (like vim buffer prev/next)

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-H     previous-window
bind -n M-L     next-window

# ── Splits & Pane Management (C-a +) ─────────────────────────────────────────
# '  looks like ─   split below
# \  looks like │   split right
# x  smart kill: instant for shell, confirm for running processes

bind "'" split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind x   if-shell -F '#{==:#{pane_current_command},zsh}' \
           'kill-pane' \
           'confirm-before -p "kill pane running #{pane_current_command}? (y/n)" kill-pane'
bind r   source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Claude Code (C-a C → key table) ──────────────────────────────────────────
#   Layout:  c/Enter = popup   / = prompt   s = split (sonnet)   w = window
#   Model:   o = opus auto    O = opus autopilot
#            s = sonnet auto  S = sonnet autopilot
#            p = opus plan (read-only)

# Restore default new-window / next-pane on c/o (server keeps stale binds
# from prior config; explicit re-bind needed on reload).
bind c new-window -c "#{pane_current_path}"
bind o select-pane -t :.+

bind C switch-client -T claude
bind -T claude c       display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" "claude"
bind -T claude Enter   display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" "claude"
bind -T claude /       command-prompt -p "claude:" \
  "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'claude --model haiku -p \"%1\"'"
bind -T claude s       split-window -h -l 50% -c "#{pane_current_path}" \
  "claude --model sonnet --permission-mode auto"
bind -T claude o       split-window -h -l 50% -c "#{pane_current_path}" \
  "claude --model opus --permission-mode auto"
bind -T claude O       split-window -h -l 50% -c "#{pane_current_path}" \
  "claude --model opus --dangerously-skip-permissions"
bind -T claude S       split-window -h -l 50% -c "#{pane_current_path}" \
  "claude --model sonnet --dangerously-skip-permissions"
bind -T claude p       split-window -h -l 50% -c "#{pane_current_path}" \
  "claude --model opus --permission-mode plan"
bind -T claude w       new-window -n "claude" -c "#{pane_current_path}" "claude"

# ── OpenCode (C-a o → key table) ─────────────────────────────────────────────
#   Layout:  o/Enter = popup   / = run prompt   s = split   w = window
#   Model:   p = pro (opus)    c = codex (gpt)  u = ui (gemini)  q = quick

bind O switch-client -T opencode
bind -T opencode o       display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" "opencode"
bind -T opencode Enter   display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" "opencode"
bind -T opencode /       command-prompt -p "opencode:" \
  "display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'opencode run \"%1\"'"
bind -T opencode s       split-window -h -l 50% -c "#{pane_current_path}" "opencode"
bind -T opencode w       new-window -n "opencode" -c "#{pane_current_path}" "opencode"
bind -T opencode p       display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" \
  "opencode -m opencode/claude-opus-4-6"
bind -T opencode c       display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" \
  "opencode -m opencode/gpt-5.3-codex"
bind -T opencode u       display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" \
  "opencode -m opencode/gemini-3.1-pro"
bind -T opencode q       display-popup  -E -w 80% -h 80% -d "#{pane_current_path}" \
  "opencode -m opencode/minimax-m2.5"

# ── Theme (Catppuccin Macchiato — v2.3.0 syntax) ─────────────────────────────
# Right-side modules: application │ session │ pomodoro
# (cpu/uptime/battery removed — desktop machine; re-add when on laptop)

set  -g  status-position           bottom
set  -g  status-left-length        100
set  -g  status-right-length       100
set  -g  status-left               ""
set  -g  status-right              "#{E:@catppuccin_status_application}"
set  -ag  status-right             "#{E:@catppuccin_status_session}"
set  -agF status-right             "#{E:@catppuccin_status_pomodoro_plus}"

set  -g  @catppuccin_flavor                    "macchiato"
# @catppuccin_status_background uses default (mantle) — solid bg required
# for rounded window separators. "none" breaks #[fg=none,reverse] trick.
set  -g  @catppuccin_window_status_style       "rounded"
set  -g  @catppuccin_window_number_position    "right"
set  -g  @catppuccin_window_text               " #W"
set  -g  @catppuccin_window_number             "#I"
set  -g  @catppuccin_window_current_text       " #W"
set  -g  @catppuccin_window_current_number     "#I"
set  -g  @catppuccin_status_fill               "icon"
set  -g  @catppuccin_status_connect_separator  "no"

# Rounded pill edges for status modules. U+E0B6 = , U+E0B4 = .
# Catppuccin defaults give a flat right edge — override to match preview.
set  -g  @catppuccin_status_left_separator     ""
set  -g  @catppuccin_status_right_separator    ""

# Restore default module icons (live tmux server cached previous overrides).
set  -g  @catppuccin_application_icon          " "
set  -g  @catppuccin_session_icon              " "

# ── Plugins ───────────────────────────────────────────────────────────────────
# Module dependencies:
#   tmux-cpu           → @catppuccin_status_cpu / _ram
#   tmux-battery       → @catppuccin_status_battery
#   tmux-pomodoro-plus → @catppuccin_status_pomodoro_plus
# (uptime is built into catppuccin, no extra plugin needed)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# ── Bootstrap TPM ─────────────────────────────────────────────────────────────

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm \
   && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
